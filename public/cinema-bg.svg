<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Projector Light -->
    <radialGradient id="spotlight">
      <stop offset="0%" stop-color="white" stop-opacity=".08"/>
      <stop offset="60%" stop-color="white" stop-opacity=".02"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Red Glow -->
    <radialGradient id="redGlow">
      <stop offset="0%" stop-color="#D72638" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#D72638" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue Glow -->
    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette">
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <!-- Noise -->
    <filter id="noise">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.85"
        numOctaves="3"
        stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>

    <!-- Blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="120"/>
    </filter>

  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Projector Light -->
  <ellipse
      cx="960"
      cy="-150"
      rx="900"
      ry="650"
      fill="url(#spotlight)"
      filter="url(#blur)"
  />

  <!-- Red Ambient -->
  <circle
      cx="250"
      cy="900"
      r="500"
      fill="url(#redGlow)"
      filter="url(#blur)"
  />

  <!-- Blue Ambient -->
  <circle
      cx="1700"
      cy="250"
      r="420"
      fill="url(#blueGlow)"
      filter="url(#blur)"
  />

  <!-- Dust -->
  <g fill="white" opacity=".12">
    <circle cx="180" cy="240" r="1.2"/>
    <circle cx="420" cy="700" r="1.4"/>
    <circle cx="620" cy="180" r="1"/>
    <circle cx="900" cy="450" r="1.5"/>
    <circle cx="1100" cy="250" r="1.2"/>
    <circle cx="1450" cy="600" r="1"/>
    <circle cx="1620" cy="320" r="1.3"/>
    <circle cx="1820" cy="820" r="1.5"/>
    <circle cx="760" cy="920" r="1.2"/>
    <circle cx="250" cy="950" r="1"/>
  </g>

  <!-- Noise -->
  <rect
      width="1920"
      height="1080"
      filter="url(#noise)"
      opacity=".35"/>

  <!-- Vignette -->
  <rect
      width="1920"
      height="1080"
      fill="url(#vignette)"
      opacity=".65"/>

</svg>